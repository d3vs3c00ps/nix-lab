# Helm values for Cilium on the lab cluster (services.kubernetes, no flannel).
# Installed from k8s-01: helm install cilium cilium/cilium -n kube-system -f /etc/cilium/values.yaml

# Use the per-node pod ranges assigned by kube-controller-manager (10.1.x.0/24).
# Cilium's default cluster-pool (10.0.0.0/8) would overlap the service range.
ipam:
  mode: kubernetes

# Cilium handles Services with eBPF; kube-proxy is disabled in modules/k8s.nix.
kubeProxyReplacement: true
# Without kube-proxy the "kubernetes" Service IP only works once Cilium runs, so
# Cilium itself must reach the API server by its real address.
k8sServiceHost: k8s-01.lab.home.arpa
k8sServicePort: 6443

routingMode: tunnel
tunnelProtocol: vxlan

cni:
  # NixOS makes /etc/cni/net.d and /opt/cni/bin unusable for Cilium; see
  # modules/k8s.nix for the writable directories and the link.
  confPath: /var/lib/cni/net.d
  binPath: /var/lib/cni/bin

operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
